name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static web
        working-directory: apps/web
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_USE_STATIC_SNAPSHOT: "1"
          NEXT_PUBLIC_SERVER_NAME: KottaiServer
          NEXT_PUBLIC_WORLD_NAME: KottaiWorld
        run: |
          # output:export cannot include Route Handlers — park the Docker BFF for this build only
          if [ -d src/app/api ]; then mv src/app/api /tmp/kottai-web-api; fi
          pnpm build:static
          if [ -d /tmp/kottai-web-api ]; then mv /tmp/kottai-web-api src/app/api; fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/out --project-name=kottaiworld --commit-dirty=true
